<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Анализатор изометрий</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23182124'/%3E%3Cpath d='M18 46 44 18M18 46h28M18 46V18' stroke='%23c9e7d6' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">∠</span><span>Изометрии<span class="brand-muted"> / workspace</span></span></div>
    <div class="top-status"><span class="status-dot" id="api-dot"></span><span id="api-status">API подключение</span><button class="ghost-button" id="history-button">История</button></div>
  </header>
  <nav class="workspace-tabs" id="workspace-tabs" aria-label="Workspace"></nav>
  <main id="app" class="app-shell"></main>
  <template id="welcome-template">
    <section class="page-grid welcome-page">
      <div class="intro-column">
        <p class="eyebrow">PIPELINE CONTROL / 01</p>
        <h1>Разбор изометрии<br><em>собран в одном месте.</em></h1>
        <p class="lead">Загрузите чертеж, выберите линии и наблюдайте за анализом без потери контекста между запусками.</p>
        <div class="welcome-actions"><button class="primary-button" id="open-history">Открыть историю <span>↗</span></button></div>
        <div class="signal-card"><span class="signal-label">Система готова</span><strong id="key-status">Проверяем DEEPSEEK_API_KEY...</strong><small id="config-note">Загрузка конфигурации</small></div>
      </div>
      <div class="control-column">
        <div class="section-heading"><span>01</span><div><h2>Источник документа</h2><p>Подготовьте PDF перед выбором линий</p></div></div>
        <div class="source-switch"><label><input type="radio" name="source-mode" value="local" checked><span>Локальный PDF<small>Изометрии.pdf</small></span></label><label><input type="radio" name="source-mode" value="upload"><span>Новый файл<small>Загрузить PDF</small></span></label></div>
        <div class="upload-row"><input id="pdf-file" type="file" accept="application/pdf"><button class="secondary-button" id="load-pdf">Загрузить PDF</button></div>
        <label class="check-row"><input id="use-cache" type="checkbox" checked><span>Использовать кеш группировки</span></label>
        <div id="document-summary" class="document-summary empty">Документ еще не загружен</div>
        <div class="section-heading groups-heading"><span>02</span><div><h2>Группы линий</h2><p>Выберите одну или несколько линий для запуска</p></div></div>
        <div class="groups-tools"><input id="groups-search" type="search" placeholder="Поиск линии, например P15_1043"><span id="groups-count">0 групп</span></div>
        <div id="groups-list" class="groups-list empty-state">Сначала загрузите PDF</div>
        <div class="run-toolbar"><label class="check-row"><input id="reanalyze" type="checkbox"><span>Переанализировать кешированные линии</span></label><label class="check-row">Делать до этапа
          <select id="stop-stage">
            <option value="">Полный анализ (DeepSeek + rule layer)</option>
            <option value="extract">Только PDF-кандидаты (без DeepSeek)</option>
            <option value="vertices">Тест: вершины от DeepSeek</option>
            <option value="local_vertices">Тест: локальная разметка вершин</option>
            <option value="classify">Кандидаты + локальная классификация (без DeepSeek)</option>
            <option value="classify_ai">Кандидаты + классификация DeepSeek</option>
            <option value="analyze">Полный DeepSeek (без локальной сборки)</option>
            <option value="analyze_no_classify">Тест: DeepSeek без классификации кандидатов</option>
            <option value="geometry">То же + geometry solver</option>
            <option value="reconstruct">Полный, но без финальной валидации</option>
          </select>
        </label><button class="primary-button" id="start-analysis" disabled>Начать анализ <span>→</span></button></div>
      </div>
    </section>
  </template>
</body>
</html>
