<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>PipeGraph</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<section class="shell">
  <nav class="topbar">
    <div class="brand">PIPE<b>GRAPH</b></div>
    <span id="backend" class="pill">…</span>
  </nav>

  <section class="step" id="step-load">
    <h1>1 · Загрузка PDF</h1>
    <div class="row">
      <label class="check"><input type="checkbox" id="use-default-pdf">
        <span>Использовать файл проекта: <b id="default-pdf-name"></b></span></label>
    </div>
    <div class="row" id="custom-row">
      <input id="pdf-path" placeholder="Путь к PDF, например E:\prog\test-chertezh\Изометрии.pdf">
      <label class="file"><input id="pdf-file" type="file" accept="application/pdf" hidden>
        <span>Выбрать файл…</span></label>
      <button id="load-pdf">Загрузить</button>
    </div>
    <div id="doc-summary" class="muted">PDF не загружен</div>
  </section>

  <section class="step" id="step-lines" hidden>
    <h1>2 · Выбор линий</h1>
    <div class="row">
      <input id="group-search" placeholder="Фильтр по id линии">
      <span id="groups-count" class="pill-soft"></span>
    </div>
    <div id="groups" class="groups one-col"></div>
    <div class="row">
      <button id="start-analysis" class="primary">Запустить анализ <span>→</span></button>
    </div>
  </section>

  <section class="step" id="step-run" hidden>
    <h1>3 · Прогресс</h1>
    <div id="run-status"></div>
    <div id="lines-progress"></div>
  </section>

  <section class="step" id="step-result" hidden>
    <h1>4 · Результаты <span id="run-title"></span></h1>
    <div id="result-body"></div>
  </section>
</section>
<script defer src="/static/app.js"></script>
</body>
</html>
