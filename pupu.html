<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Tom & Jerry House — Blueprint</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e2fbf; }
  #c { width: 100vw; height: 100vh; display: block; }
  #hint {
    position: absolute; top: 12px; left: 12px;
    color: #fff; font-family: 'Courier New', monospace; font-size: 12px;
    background: rgba(0,0,0,0.35); padding: 8px 14px;
    border: 1px solid #fff; letter-spacing: 1px;
  }
  #title {
    position: absolute; top: 12px; right: 12px;
    color: #fff; font-family: 'Courier New', monospace; font-size: 14px;
    background: #1e2fbf; padding: 8px 16px;
    border: 2px solid #fff; letter-spacing: 2px; font-weight: bold;
  }
  #legend {
    position: absolute; bottom: 12px; right: 12px;
    color: #fff; font-family: 'Courier New', monospace; font-size: 11px;
    background: rgba(0,0,0,0.35); padding: 10px 14px;
    border: 1px solid #fff; line-height: 1.8;
  }
  #legend .sw {
    display: inline-block; width: 14px; height: 3px;
    margin-right: 8px; vertical-align: middle;
  }
</style>
</head>
<body>
<div id="hint">🖱 ЛКМ — вращение · ПКМ — панорама · Колесо — зум</div>
<div id="title">TOM &amp; JERRY · FLOOR PLAN</div>
<div id="legend">
  <div><span class="sw" style="background:#ffffff"></span>Мебель и стены</div>
  <div><span class="sw" style="background:#ffd166"></span>Норки Джерри</div>
  <div><span class="sw" style="background:#ff6b9d"></span>Ловушки Тома</div>
</div>
<canvas id="c"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

// ============================================================
// СЦЕНА
// ============================================================
const canvas = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e2fbf);

const frustum = 10;
let aspect = window.innerWidth / window.innerHeight;
const camera = new THREE.OrthographicCamera(
  -frustum * aspect, frustum * aspect,
   frustum,         -frustum,
  0.1, 500
);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

// ============================================================
// МАТЕРИАЛЫ ТОЛСТЫХ ЛИНИЙ
// ============================================================
function makeMat(color, width = 2, opacity = 1) {
  return new LineMaterial({
    color,
    linewidth: width,           // в пикселях
    transparent: opacity < 1,
    opacity,
    resolution: new THREE.Vector2(window.innerWidth, window.innerHeight),
  });
}

const MAT_WALL    = makeMat(0xffffff, 2.2);
const MAT_FURN    = makeMat(0xffffff, 1.6);
const MAT_FURN_D  = makeMat(0x9fc4ff, 1.0, 0.55);  // «скрытые» рёбра мебели
const MAT_FLOOR   = makeMat(0x4a7ae0, 1.0, 0.4);
const MAT_TRAP    = makeMat(0xff6b9d, 2.0);
const MAT_JERRY   = makeMat(0xffd166, 2.4);
const MAT_ACCENT  = makeMat(0xffd166, 1.4);

// ============================================================
// ХЕЛПЕРЫ ЛИНИЙ
// ============================================================
function line(mat, points) {
  const flat = [];
  for (const p of points) flat.push(p[0], p[1], p[2]);
  const geo = new LineGeometry();
  geo.setPositions(flat);
  const l = new Line2(geo, mat);
  l.computeLineDistances();
  scene.add(l);
  return l;
}

// Прямоугольник на полу
function rectFloor(mat, x, z, w, d, y = 0) {
  line(mat, [
    [x, y, z], [x + w, y, z], [x + w, y, z + d],
    [x, y, z + d], [x, y, z],
  ]);
}

// Прямоугольный «каркас» параллелепипеда
function box(mat, matHidden, cx, cz, w, d, h, y0 = 0, hiddenBottom = true) {
  const x0 = cx - w / 2, x1 = cx + w / 2;
  const z0 = cz - d / 2, z1 = cz + d / 2;
  const y1 = y0 + h;

  // Верхняя грань
  line(mat, [
    [x0, y1, z0], [x1, y1, z0], [x1, y1, z1],
    [x0, y1, z1], [x0, y1, z0],
  ]);

  // Вертикальные рёбра (видимые — передние)
  line(mat, [[x0, y0, z1], [x0, y1, z1]]);
  line(mat, [[x1, y0, z1], [x1, y1, z1]]);
  line(mat, [[x0, y0, z0], [x0, y1, z0]]);
  line(mat, [[x1, y0, z0], [x1, y1, z0]]);

  // Нижний контур
  line(matHidden, [
    [x0, y0, z0], [x1, y0, z0], [x1, y0, z1],
    [x0, y0, z1], [x0, y0, z0],
  ]);
}

// ============================================================
// ПОЛ С СЕТКОЙ
// ============================================================
const W = 16;
const D = 12;
const H = 5;

for (let x = -W/2; x <= W/2; x += 1) {
  line(MAT_FLOOR, [[x, 0, -D/2], [x, 0, D/2]]);
}
for (let z = -D/2; z <= D/2; z += 1) {
  line(MAT_FLOOR, [[-W/2, 0, z], [W/2, 0, z]]);
}

// ============================================================
// СТЕНЫ (только рёбра — вид изнутри)
// ============================================================
// Нижний контур
line(MAT_WALL, [
  [-W/2, 0, -D/2], [ W/2, 0, -D/2],
  [ W/2, 0,  D/2], [-W/2, 0,  D/2],
  [-W/2, 0, -D/2],
]);

// Верхний контур
line(MAT_WALL, [
  [-W/2, H, -D/2], [ W/2, H, -D/2],
  [ W/2, H,  D/2], [-W/2, H,  D/2],
  [-W/2, H, -D/2],
]);

// Вертикальные рёбра
line(MAT_WALL, [[-W/2, 0, -D/2], [-W/2, H, -D/2]]);
line(MAT_WALL, [[ W/2, 0, -D/2], [ W/2, H, -D/2]]);
line(MAT_WALL, [[ W/2, 0,  D/2], [ W/2, H,  D/2]]);
line(MAT_WALL, [[-W/2, 0,  D/2], [-W/2, H,  D/2]]);

// ============================================================
// МЕБЕЛЬ
// ============================================================

// --- ДИВАН (в гостиной, слева) ---
// Основной блок
box(MAT_FURN, MAT_FURN_D, -5.5, -3, 4.5, 1.6, 0.8);
// Спинка (тонкая полоса позади)
box(MAT_FURN, MAT_FURN_D, -5.5, -3 - 0.65, 4.5, 0.3, 1.1);
// Подушки (2 штуки)
box(MAT_FURN, MAT_FURN_D, -6.6, -3, 1.4, 1.3, 0.25, 0.8);
box(MAT_FURN, MAT_FURN_D, -4.4, -3, 1.4, 1.3, 0.25, 0.8);
// Подлокотники
box(MAT_FURN, MAT_FURN_D, -7.9, -3, 0.4, 1.6, 1.0);
box(MAT_FURN, MAT_FURN_D, -3.1, -3, 0.4, 1.6, 1.0);

// --- ВТОРОЙ ДИВАН (справа, лицом к камину) ---
box(MAT_FURN, MAT_FURN_D, 5.5, -3, 4.5, 1.6, 0.8);
box(MAT_FURN, MAT_FURN_D, 5.5, -3 - 0.65, 4.5, 0.3, 1.1);
box(MAT_FURN, MAT_FURN_D, 4.4, -3, 1.4, 1.3, 0.25, 0.8);
box(MAT_FURN, MAT_FURN_D, 6.6, -3, 1.4, 1.3, 0.25, 0.8);
box(MAT_FURN, MAT_FURN_D, 3.1, -3, 0.4, 1.6, 1.0);
box(MAT_FURN, MAT_FURN_D, 7.9, -3, 0.4, 1.6, 1.0);

// --- ЖУРНАЛЬНЫЙ СТОЛИК (между диванами) ---
box(MAT_FURN, MAT_FURN_D, 0, -3, 3, 1.8, 0.1, 0.5);
// Ножки
box(MAT_FURN, MAT_FURN_D, -1.2, -3.7, 0.15, 0.15, 0.5);
box(MAT_FURN, MAT_FURN_D,  1.2, -3.7, 0.15, 0.15, 0.5);
box(MAT_FURN, MAT_FURN_D, -1.2, -2.3, 0.15, 0.15, 0.5);
box(MAT_FURN, MAT_FURN_D,  1.2, -2.3, 0.15, 0.15, 0.5);

// --- КАМИН (в центре задней стены) ---
box(MAT_FURN, MAT_FURN_D, 0, -D/2 + 0.5, 3, 1, 2.5);
// Топка (отверстие)
box(MAT_FURN, MAT_FURN_D, 0, -D/2 + 0.5, 1.6, 1.1, 1.0, 0.2);
// Дымоход
box(MAT_FURN, MAT_FURN_D, 0, -D/2 + 0.5, 1, 0.8, 1.5, 2.5);

// --- КНИЖНЫЙ ШКАФ (слева от камина) ---
box(MAT_FURN, MAT_FURN_D, -4.5, -D/2 + 0.4, 2.2, 0.8, 2.8);
// Полки
for (let i = 1; i <= 3; i++) {
  line(MAT_FURN, [
    [-5.6, i * 0.7, -D/2 + 0.4],
    [-3.4, i * 0.7, -D/2 + 0.4],
  ]);
}

// --- ВЫСОКИЙ ШКАФ (справа от камина) ---
box(MAT_FURN, MAT_FURN_D, 4.5, -D/2 + 0.5, 2.2, 1, 3.5);
// Дверцы
line(MAT_FURN, [
  [4.5, 0, -D/2 + 1.0], [4.5, 3.5, -D/2 + 1.0],
]);

// --- КУХОННЫЙ СТОЛ (правая часть) ---
box(MAT_FURN, MAT_FURN_D, 5.5, 1, 3, 2, 0.1, 0.8);
// Ножки
box(MAT_FURN, MAT_FURN_D, 4.2, 0.1, 0.15, 0.15, 0.8);
box(MAT_FURN, MAT_FURN_D, 6.8, 0.1, 0.15, 0.15, 0.8);
box(MAT_FURN, MAT_FURN_D, 4.2, 1.9, 0.15, 0.15, 0.8);
box(MAT_FURN, MAT_FURN_D, 6.8, 1.9, 0.15, 0.15, 0.8);

// Стулья (4 штуки)
function chair(cx, cz) {
  box(MAT_FURN, MAT_FURN_D, cx, cz, 0.8, 0.8, 0.1, 0.5);
  box(MAT_FURN, MAT_FURN_D, cx, cz - 0.35, 0.8, 0.1, 0.9);
  box(MAT_FURN, MAT_FURN_D, cx - 0.35, cz, 0.1, 0.8, 0.5);
  box(MAT_FURN, MAT_FURN_D, cx + 0.35, cz, 0.1, 0.8, 0.5);
}
chair(4, -0.2);
chair(7, -0.2);
chair(4, 2.2);
chair(7, 2.2);

// --- ПЛИТА (у задней стены кухни) ---
box(MAT_FURN, MAT_FURN_D, 5.5, -D/2 + 0.6, 2, 1.1, 1.0);
// Конфорки
line(MAT_FURN, [[5, 1.0, -D/2 + 0.6], [6, 1.0, -D/2 + 0.6]]);

// --- ХОЛОДИЛЬНИК ---
box(MAT_FURN, MAT_FURN_D, 7.5, -D/2 + 0.6, 1.1, 1.1, 2.4);

// --- КРОВАТЬ (спальня, правая нижняя) ---
box(MAT_FURN, MAT_FURN_D, 5.5, 4, 3, 4, 0.5);
// Подушки
box(MAT_FURN, MAT_FURN_D, 5.5, 2.6, 2.6, 1, 0.2, 0.5);
// Одеяло (полоса)
line(MAT_FURN, [
  [4, 0.5, 3.4], [7, 0.5, 3.4],
]);

// --- ТУМБОЧКА ---
box(MAT_FURN, MAT_FURN_D, 8, 2.5, 0.9, 0.9, 0.7);

// --- ЛАМПА (торшер, у дивана) ---
// Основание
box(MAT_FURN, MAT_FURN_D, -8.5, 2, 0.4, 0.4, 0.1);
// Штанга
line(MAT_FURN, [[-8.5, 0.1, 2], [-8.5, 2.2, 2]]);
// Абажур (трапеция)
line(MAT_FURN, [
  [-8.8, 2.2, 2], [-8.2, 2.2, 2],
  [-8.4, 2.7, 2], [-8.6, 2.7, 2],
  [-8.8, 2.2, 2],
]);

// --- КОВРЫ (на полу) ---
rectFloor(MAT_FURN, -6.5, 3, 3, 2);
rectFloor(MAT_FURN, -6.3, 3.2, 2.6, 1.6);
rectFloor(MAT_FURN, 5.5, 0, 4, 2.5);

// ============================================================
// КАМЕРА
// ============================================================
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.target.set(0, 1, 0);

camera.position.set(20, 16, 20);
camera.lookAt(0, 1, 0);
controls.update();

// ============================================================
// РЕСАЙЗ
// ============================================================
window.addEventListener('resize', () => {
  aspect = window.innerWidth / window.innerHeight;
  camera.left   = -frustum * aspect;
  camera.right  =  frustum * aspect;
  camera.top    =  frustum;
  camera.bottom = -frustum;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);

  // Обновляем resolution у всех LineMaterial
  scene.traverse(obj => {
    if (obj.material && obj.material.isLineMaterial) {
      obj.material.resolution.set(window.innerWidth, window.innerHeight);
    }
  });
});

// ============================================================
// АНИМАЦИЯ
// ============================================================
function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
}
loop();
</script>
</body>
</html>
